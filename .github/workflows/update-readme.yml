name: Update README

on:
  schedule:
    # 17:00 UTC = 01:00 Asia/Taipei
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Latest writing across blog / daily / substack (RSS)
      - name: Pull blog posts
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://blog.pdzeng.com/rss.xml,https://daily.pdzeng.com/rss.xml,https://pdzeng.substack.com/feed"
          max_post_count: 6
          comment_tag_name: "BLOG-POSTS"
          template: "- [$title]($url) <sub>$date</sub>"
          date_format: "yyyy-MM-dd"
          commit_message: "chore(readme): refresh latest writing"

      # Recently active public repos
      - name: Update recent repos
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data: repos } = await github.rest.repos.listForUser({
              username: 'panda850819',
              sort: 'pushed',
              per_page: 20,
              type: 'owner',
            });
            const lines = repos
              .filter(r => !r.fork && !r.private && !r.archived)
              .slice(0, 6)
              .map(r => {
                const desc = r.description ? ` — ${r.description}` : '';
                const date = new Date(r.pushed_at).toISOString().slice(0, 10);
                return `- **[${r.name}](${r.html_url})**${desc} <sub>${date}</sub>`;
              });
            const block = `<!-- RECENT-REPOS:START -->\n${lines.join('\n')}\n<!-- RECENT-REPOS:END -->`;
            const readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(
              /<!-- RECENT-REPOS:START -->[\s\S]*?<!-- RECENT-REPOS:END -->/,
              block,
            );
            fs.writeFileSync('README.md', updated);

      # Recent public pull requests authored by you
      - name: Update recent PRs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { data } = await github.rest.search.issuesAndPullRequests({
              q: 'author:panda850819 is:pr is:public',
              sort: 'created',
              order: 'desc',
              per_page: 8,
            });
            const lines = data.items.slice(0, 6).map(p => {
              const repo = p.repository_url.split('/').slice(-2).join('/');
              const date = new Date(p.created_at).toISOString().slice(0, 10);
              const state = p.pull_request?.merged_at ? 'merged' : p.state;
              return `- [${p.title}](${p.html_url}) — \`${repo}\` <sub>${state} · ${date}</sub>`;
            });
            const body = lines.length ? lines.join('\n') : '_No recent public PRs._';
            const block = `<!-- RECENT-PRS:START -->\n${body}\n<!-- RECENT-PRS:END -->`;
            const readme = fs.readFileSync('README.md', 'utf8');
            const updated = readme.replace(
              /<!-- RECENT-PRS:START -->[\s\S]*?<!-- RECENT-PRS:END -->/,
              block,
            );
            fs.writeFileSync('README.md', updated);

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore(readme): refresh repos & PRs $(date -u +%Y-%m-%d)"
            git push
          fi
